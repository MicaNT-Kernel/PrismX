name: PrismX CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: gcc
          - os: macos-latest
            compiler: clang

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GCC on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build
          echo "CXX=g++-13" >> $GITHUB_ENV

      - name: Setup Ninja on Windows
        if: matrix.os == 'windows-latest'
        run: |
          choco install ninja

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build PrismX
        run: |
          cmake --build build --config Release

      - name: Run Standalone Test Suite
        run: |
          ctest --test-dir build -C Release --output-on-failure
